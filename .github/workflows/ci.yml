name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DevOpsDemo/DevOpsDemo.csproj

      - name: Build application
        run: |
          dotnet build DevOpsDemo/DevOpsDemo.csproj \
            --configuration Release \
            --no-restore

      - name: Build Docker image
        run: docker build -t devops-demo:ci ./DevOpsDemo

      - name: Test Docker container
        run: |
          docker run -d -p 8080:8080 \
            --name devops-demo devops-demo:ci

          echo "Waiting for application to become healthy..."

          for attempt in {1..15}; do
            if curl --fail --silent --show-error \
              --max-time 5 \
              http://localhost:8080/health; then
              echo "Application is healthy!"
              exit 0
            fi

            echo "Attempt $attempt failed. Retrying..."
            sleep 3
          done

          echo "Application failed to become healthy."
          exit 1

      - name: Display container logs
        if: failure()
        run: |
          docker ps -a
          docker logs devops-demo || true

      - name: Cleanup Docker container
        if: always()
        run: docker rm -f devops-demo || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform -chdir=terraform fmt -check

      - name: Terraform init
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform validate
        run: terraform -chdir=terraform validate